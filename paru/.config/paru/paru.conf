# ==============================================================================
# paru yapılandırması (CachyOS)
# /etc/paru.conf sistem varsayılanlarını (PgpFetch, Devel, Provides) korur,
# üzerine temizlik ve kullanım kolaylığı kurallarını ekler.
# ==============================================================================
Include = /etc/paru.conf

[options]
# Arama sonuçlarında en alakalı paketi en alta (göz hizasına) koy
BottomUp
# AUR derleme/kurulum sonrası geçici derleme dosyalarını otomatik temizle
CleanAfter
# Güncelleme öncesi Arch Linux "manuel müdahale" duyurularını göster
NewsOnUpgrade
# Not: SkipReview bilerek kapalıdır — her AUR işleminde PKGBUILD incelemesi açık kalır.
