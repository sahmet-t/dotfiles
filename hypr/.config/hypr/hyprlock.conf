# ==============================================================================
# Hyprlock — Minimal Kilit Ekranı
# ==============================================================================

source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.72
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 72
    font_family = Inter Bold
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%d %B %Y, %A"
    color = $fg_muted
    font_size = 18
    font_family = Inter
    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = $accent
    inner_color = $bg_alt
    font_color = $fg
    fade_on_empty = true
    placeholder_text = Parola...
    rounding = 12
    position = 0, -60
    halign = center
    valign = center
}
