# ==============================================================================
# Hypridle — Laptop Pil & Otomatik Kilit Yönetimi
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock --grace 2
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}

# 4 dakika hareketsizlikte ekran parlaklığını kıs
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# 6 dakika hareketsizlikte ekranı kilitle
listener {
    timeout = 360
    on-timeout = loginctl lock-session
}

# 8 dakika hareketsizlikte ekranı kapat
listener {
    timeout = 480
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'off' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })" && brightnessctl -r
}

# 20 dakika hareketsizlikte uykuya al
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
