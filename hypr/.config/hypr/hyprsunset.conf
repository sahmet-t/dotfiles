# ==============================================================================
# Hyprsunset — Otomatik Zamanlı Mavi Işık Filtresi
# Gündüz doğal renk, akşam yumuşak geçiş, gece derin sıcak ton.
# Üst bardaki gece ışığı ikonundan her an elle değiştirilebilir.
# ==============================================================================

max-gamma = 120

# Gündüz (07:00+) — Doğal renkler (filtre kapalı)
profile {
    time = 07:00
    identity = true
}

# Akşamüstü (19:30+) — Hafif sıcak ton
profile {
    time = 19:30
    temperature = 4500
}

# Gece (21:30+) — Göz yormayan derin sıcak ton
profile {
    time = 21:30
    temperature = 3400
}
